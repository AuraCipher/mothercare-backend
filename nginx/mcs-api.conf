# ─────────────────────────────────────────────────────────────────────────────
# api.mothercareschool.pk — nginx in front of the Node app
#
#   client → Cloudflare → nginx (this file) → 127.0.0.1:5000 (PM2)
#
# Last edited 2026-10-04:
#   • /setup/init closed worldwide (404 — bootstrap completed, CEO created)
#   • real_ip added so nginx/Express see the visitor, not Cloudflare
#   • Socket.IO Connection header made conditional (map) instead of blanket
# ─────────────────────────────────────────────────────────────────────────────

# ── Real client IP behind Cloudflare ────────────────────────────────────────
# Cloudflare connects from its own edge IPs, so $remote_addr (and therefore
# X-Real-IP / X-Forwarded-For) would be a Cloudflare address: Express
# rate-limits and the audit log would key on the proxy, not the user.
# CF-Connecting-IP is honoured only from these networks, so a direct hit on
# the origin IP cannot spoof it. Origin resolves A-only → IPv4 suffices;
# IPv6 kept for safety.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Socket.IO handshake ─────────────────────────────────────────────────────
# Send "upgrade" only when the client actually asked to upgrade; the old
# blanket `Connection "upgrade"` on every request was wrong (it happened to
# work, but it breaks upstream connection reuse).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name api.mothercareschool.pk;
    listen 80;

    # http-01 renewal. Keep this unless /etc/letsencrypt/renewal/*.conf says
    # `authenticator = nginx` (certbot then manages it itself).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl; # managed by Certbot
    server_name api.mothercareschool.pk;

    ssl_certificate /etc/letsencrypt/live/api.mothercareschool.pk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.mothercareschool.pk/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # ── Bootstrap endpoint: CLOSED ──────────────────────────────────────────
    # /setup/init ran once (2026-10-04) to create the CEO and can never run
    # again — the app returns 409 because initialized:true is already set.
    # nginx answers 404 (not 403) so the endpoint's existence is not
    # confirmed. Direct-to-app (http://127.0.0.1:5000/setup/init) bypasses
    # this block and keeps returning the app's own 409 forever.
    location = /setup/init {
        return 404;
    }

    # /setup/status is deliberately NOT restricted: the key-manager page reads
    # {"initialized":true} from the browser. It exposes no PII.

    # dotfiles (.env, .git, .npmrc …) never leave the box, even though the
    # app 404s them too. Regex only — /key-manager and /uploads/x.jpg pass.
    location ~ /\. {
        return 404;
    }

    # busboy allows 1 GB uploads (src/routes/upload.routes.ts)
    client_max_body_size 1024m;
    proxy_request_buffering off;              # stream uploads, don't buffer to disk

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;             # keep socket.io connections alive
        proxy_send_timeout 3600s;
        proxy_buffering off;                  # streaming/SSE
    }
}
